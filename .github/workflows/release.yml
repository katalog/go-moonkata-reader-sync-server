name: Release

# Runs when a tag starting with v (v1.0.0, etc.) is pushed — also triggered by
# moonkata-reader-project (the umbrella repo) pushing that same tag down to this repo. Even though
# the output is a Windows exe, it's plain Go with no CGO, so it cross-compiles fine — just build
# with GOOS=windows on ubuntu-latest, no need for a windows-latest runner.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Compute release version
        id: version
        run: echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # -H=windowsgui: runs as a tray icon only, no console window. CGO_ENABLED=0 is already the
      # default so it doesn't need to be set explicitly, but it's kept here to make the plain-Go
      # assumption visible in the workflow too.
      - name: Build Windows exe
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          mkdir -p release-artifacts
          go build -ldflags="-H=windowsgui" \
            -o "release-artifacts/moonkata-sync-server-${{ steps.version.outputs.name }}.exe" .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.exe
          generate_release_notes: true
          # GitHub adds a "Pre-release" badge if the tag name contains -beta (e.g. v1.6.0-beta.1).
          prerelease: ${{ contains(github.ref_name, '-beta') }}
